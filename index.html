<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage scolaire — Châteaudun</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
  #stage { background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; width: 100%; max-width: 680px; height: 600px; }
  #progress-bar { height: 3px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
  #progress-fill { height: 100%; background: linear-gradient(90deg, #5DCAA5, #7F77DD); width: 0%; transition: width 0.3s linear; }
  #header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 0.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); flex-shrink: 0; }
  .av-hd { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #fff; margin-left: -6px; border: 1.5px solid #1a1a2e; }
  #header .title { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.9); }
  #header .subtitle { font-size: 11px; color: rgba(255,255,255,0.45); }
  #messages { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
  .msg { display: flex; align-items: flex-end; gap: 8px; opacity: 0; transform: translateY(10px); transition: opacity 0.4s, transform 0.4s; max-width: 78%; }
  .msg.show { opacity: 1; transform: translateY(0); }
  .msg.right { flex-direction: row-reverse; align-self: flex-end; }
  .msg.left { align-self: flex-start; }
  .av-sm { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: #fff; flex-shrink: 0; }
  .bubble { padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.5; word-break: break-word; }
  .right .bubble { border-bottom-right-radius: 4px; }
  .left .bubble { border-bottom-left-radius: 4px; }
  .sender-label { font-size: 10px; font-weight: 500; margin-bottom: 3px; }
  .msg.right .sender-label { text-align: right; }
  .msg-wrap { display: flex; flex-direction: column; }
  .msg.right .msg-wrap { align-items: flex-end; }
  .msg.left .msg-wrap { align-items: flex-start; }
  #typing-row { display: flex; align-items: center; gap: 8px; min-height: 30px; flex-shrink: 0; padding: 0 16px 10px; }
  .typing-indicator { display: none; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 14px; border-bottom-left-radius: 4px; }
  .typing-indicator span { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.55); animation: bounce 0.9s infinite; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }
  #typing-name { font-size: 10px; color: rgba(255,255,255,0.4); }
  #controls { display: flex; align-items: center; gap: 10px; padding: 11px 18px; background: rgba(0,0,0,0.3); flex-shrink: 0; }
  #controls button { background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.85); padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: inherit; transition: background 0.2s; }
  #controls button:hover { background: rgba(255,255,255,0.2); }
  #msg-counter { font-size: 11px; color: rgba(255,255,255,0.4); margin-left: auto; }
  .image-bubble { width: 200px; height: 120px; border-radius: 10px; overflow: hidden; border: 0.5px solid rgba(255,255,255,0.15); }
  .image-bubble img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>

const messages = [

const SPEED = 1800;
const TYPING_DELAY = 750;

const avGroup = document.getElementById('av-group');
Object.entries(users).forEach(([name, u]) => {
  const av = document.createElement('div');
  av.className = 'av-hd';
  av.style.background = u.bg;
  av.textContent = u.initials;
  av.title = name;
  avGroup.appendChild(av);
});

const messagesEl = document.getElementById('messages');
const typingEl = document.getElementById('typing');
const typingNameEl = document.getElementById('typing-name');
const progressFill = document.getElementById('progress-fill');
const counter = document.getElementById('msg-counter');
const btnPlay = document.getElementById('btn-play');
const btnRestart = document.getElementById('btn-restart');

counter.textContent = '0 / ' + messages.length;

let current = 0, timer = null, playing = false;

function hexToRgb(hex) {
  return parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16);
}

function createMessageEl(msg) {
  const u = users[msg.from];
  const isMe = msg.from === ME;
  const row = document.createElement('div');
  row.className = 'msg ' + (isMe ? 'right' : 'left');
  const avEl = document.createElement('div');
  avEl.className = 'av-sm';
  avEl.style.background = u.bg;
  avEl.textContent = u.initials;
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';
  const label = document.createElement('div');
  label.className = 'sender-label';
  label.style.color = u.color;
  label.textContent = msg.from;
  let content;
  if (msg.image) {
    content = document.createElement('div');
    content.className = 'image-bubble';
    const img = document.createElement('img');
    img.src = IMG_SRC;
    img.alt = 'Vue du château de Châteaudun';
    content.appendChild(img);
  } else {
    content = document.createElement('div');
    content.className = 'bubble';
    if (isMe) {
      content.style.background = 'rgba(55,138,221,0.25)';
      content.style.border = '0.5px solid rgba(55,138,221,0.4)';
      content.style.color = '#e8f2fc';
    } else {
      content.style.background = 'rgba(255,255,255,0.08)';
      content.style.border = '0.5px solid rgba(255,255,255,0.12)';
      content.style.color = 'rgba(255,255,255,0.88)';
    }
    content.textContent = msg.text;
  }
  wrap.appendChild(label);
  wrap.appendChild(content);
  if (isMe) { row.appendChild(wrap); row.appendChild(avEl); }
  else { row.appendChild(avEl); row.appendChild(wrap); }
  return row;
}

function showTyping(name) {
  const u = users[name];
  typingEl.style.display = 'flex';
  typingEl.style.background = 'rgba('+hexToRgb(u.bg)+',0.3)';
  typingNameEl.textContent = name + ' écrit…';
  typingNameEl.style.color = u.color;
}
function hideTyping() {
  typingEl.style.display = 'none';
  typingNameEl.textContent = '';
}

function step() {
  if (current >= messages.length) {
    hideTyping(); playing = false;
    btnPlay.textContent = '✓ Terminé';
    progressFill.style.width = '100%';
    return;
  }
  const msg = messages[current];
  showTyping(msg.from);
  timer = setTimeout(function() {
    hideTyping();
    const el = createMessageEl(msg);
    messagesEl.appendChild(el);
    requestAnimationFrame(function() { el.classList.add('show'); });
    messagesEl.scrollTop = messagesEl.scrollHeight;
    current++;
    counter.textContent = current + ' / ' + messages.length;
    progressFill.style.width = (current / messages.length * 100) + '%';
    if (playing) timer = setTimeout(step, SPEED);
  }, TYPING_DELAY);
}

function play() {
  if (playing) {
    playing = false; clearTimeout(timer); hideTyping();
    btnPlay.textContent = '▶ Reprendre';
  } else {
    if (current >= messages.length) return;
    playing = true;
    btnPlay.textContent = '⏸ Pause';
    step();
  }
}

function restart() {
  clearTimeout(timer); playing = false; current = 0;
  messagesEl.innerHTML = '';
  hideTyping();
  progressFill.style.width = '0%';
  counter.textContent = '0 / ' + messages.length;
  btnPlay.textContent = '▶ Lecture';
}

btnPlay.addEventListener('click', play);
btnRestart.addEventListener('click', restart);
</script>
</body>
</html>
